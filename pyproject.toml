[project]
name = "proxima"
version = "0.1.2"
description = "A high-performance C++17 implementation of the Hierarchical Navigable Small World (HNSW) algorithm for approximate nearest neighbor search, with Python bindings and SIMD-optimized search"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Vishvam S" }
]
dependencies = [
    "matplotlib<3.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "numpy>=1.24",
]

benchmark = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "catppuccin>=1.3",
    "hnswlib>=0.8",
]

[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind==3.0.1",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"

[tool.scikit-build.wheel]
packages = ["python/proxima"]
py-api = "cp312"

[tool.scikit-build.cmake]
version = ">=3.16"

[tool.scikit-build.cmake.define]
PROXIMA_BUILD_TESTS = "OFF"
PROXIMA_BUILD_BENCHMARKS = "OFF"
PROXIMA_BUILD_PYTHON = "ON"

[tool.scikit-build.sdist]
include = [
    "src/**",
    "include/**",
    "bindings/**",
    "tests/**",
    "benchmarks/**",
    "CMakeLists.txt",
    "CMakePresets.json",
    "Makefile",
    "README.md",
    "LICENSE",
]
