name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install cibuildwheel
        run: uv tool install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel --output-dir dist

      - name: Build source distribution
        run: |
          uv build --sdist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/


  test:
    name: Test package
    needs: build-wheels

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Test Linux wheel
        shell: bash
        run: |
          WHEEL=$(find dist -name '*manylinux*.whl' -print -quit)

          if [ -z "$WHEEL" ]; then
            echo "No manylinux wheel found"
            find dist -type f
            exit 1
          fi

          TEST_VENV=$(mktemp -d)
          trap 'rm -rf "$TEST_VENV"' EXIT

          uv venv \
            --python 3.12 \
            "$TEST_VENV"

          uv pip install \
            --python "$TEST_VENV/bin/python" \
            "$WHEEL"

          uv pip install \
            --python "$TEST_VENV/bin/python" \
            "pytest>=8" \
            "numpy>=1.24"

          "$TEST_VENV/bin/python" \
            -c "import proxima; print('Proxima imported from:', proxima.__file__)"

          "$TEST_VENV/bin/python" \
            -m pytest \
            tests/python \
            -v


  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: |
          uv publish dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true