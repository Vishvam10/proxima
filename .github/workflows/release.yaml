name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build packages
        run: |
          uv build

      - name: Test wheel
        shell: bash
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)

          if [ -z "$WHEEL" ]; then
            echo "No wheel found"
            exit 1
          fi

          TEST_VENV=$(mktemp -d)

          trap 'rm -rf "$TEST_VENV"' EXIT

          uv venv \
            --python 3.12 \
            "$TEST_VENV"

          uv pip install \
            --python "$TEST_VENV/bin/python" \
            "$WHEEL"

          uv pip install \
            --python "$TEST_VENV/bin/python" \
            "pytest>=8" \
            "numpy>=1.24"

          "$TEST_VENV/bin/python" \
            -c "import proxima; print('Proxima imported from:', proxima.__file__)"

          "$TEST_VENV/bin/python" \
            -m pytest \
            tests/python \
            -v

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: true

      - name: List packages
        run: |
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true